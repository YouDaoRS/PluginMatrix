[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pluginmatrix"
version = "0.4.0"
description = "Real Paper server runtime verification for Minecraft plugins"
requires-python = ">=3.10"

[project.scripts]
pluginmatrix = "pluginmatrix.cli:main"

[tool.setuptools.packages.find]
include = ["pluginmatrix*"]
