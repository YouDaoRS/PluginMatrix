name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and release build tools
        run: python -m pip install -e ".[release]"

      - name: Compile Python sources
        run: python -m compileall pluginmatrix tests ci-fixtures/build_fixtures.py

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
