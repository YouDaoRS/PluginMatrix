name: Compatibility Matrix

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Repository-relative JSON Matrix config"
        required: true
        default: "examples/ci-matrix.json"
        type: string
      plugin_jar:
        description: "Repository-relative plugin JAR to test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    name: Real Paper compatibility matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package
        run: python -m pip install -e .

      - name: Prepare Matrix configuration
        id: prepare
        continue-on-error: true
        env:
          MATRIX_CONFIG: ${{ inputs.config }}
          PLUGIN_JAR: ${{ inputs.plugin_jar }}
        run: |
          set +e
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from pluginmatrix.files import atomic_copy, atomic_json, protect_inputs, reject_links

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()

          def safe_error(label, raw, detail):
              message = f"Field '{label}' has value '{raw}'; {detail}"
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{message}")

          def resolve_input(label, raw):
              candidate = Path(raw)
              if candidate.is_absolute():
                  safe_error(label, raw, "expected a repository-relative file inside GITHUB_WORKSPACE")
                  raise SystemExit(2)
              path = (workspace / candidate).resolve()
              try:
                  path.relative_to(workspace)
              except ValueError:
                  safe_error(label, raw, "resolved outside GITHUB_WORKSPACE")
                  raise SystemExit(2)
              if not path.is_file():
                  safe_error(label, raw, f"resolved to '{path}', but the file was not found")
                  raise SystemExit(2)
              return path

          config = resolve_input("config", os.environ["MATRIX_CONFIG"])
          plugin = resolve_input("plugin_jar", os.environ["PLUGIN_JAR"])
          if config.samefile(plugin):
              safe_error("plugin_jar", os.environ["PLUGIN_JAR"], "must be different from the Matrix config file")
              raise SystemExit(2)
          try:
              for output in (workspace / '.ci/plugin.jar', workspace / '.ci/matrix.json', workspace / '.pluginmatrix'):
                  reject_links(output)
                  protect_inputs(output, [config, plugin])
              (workspace / ".ci").mkdir(exist_ok=True)
          except (OSError, ValueError) as exc:
              safe_error("plugin_jar", os.environ["PLUGIN_JAR"], f"could not be copied to '.ci/plugin.jar' ({exc})")
              raise SystemExit(2)
          print(f"Validated config: {str(config)!r}")
          print(f"Validated plugin: {str(plugin)!r}")

          import json
          source = config
          document = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(document, dict):
              raise SystemExit("Matrix config must contain a JSON object")
          environments = document.get("environments")
          if not isinstance(environments, list) or not environments:
              raise SystemExit("Matrix config must contain a non-empty environments array")
          for index, environment in enumerate(environments, start=1):
              java = environment.get("java") if isinstance(environment, dict) else None
              if str(java) != "17":
                  raise SystemExit(f"environment #{index} must use Java 17 in this workflow")
          options = document.setdefault("options", {})
          if not isinstance(options, dict):
              raise SystemExit("Matrix config options must be an object")
          # The generated config lives under .ci, so these paths are relative to .ci.
          document["plugin"] = "plugin.jar"
          options["work_dir"] = "../.pluginmatrix/runs"
          options["cache_dir"] = "../.pluginmatrix/cache"
          options["report"] = "../.pluginmatrix/matrix-report.json"
          atomic_copy(plugin, workspace / '.ci/plugin.jar')
          atomic_json(workspace / '.ci/matrix.json', document)
          print(Path(".ci/matrix.json").read_text(encoding="utf-8"))
          PY
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Unable to prepare Matrix configuration"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Run Compatibility Matrix
        id: matrix
        continue-on-error: true
        if: steps.prepare.outputs.exit_code == '0'
        run: |
          set +e
          python -m pluginmatrix matrix .ci/matrix.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Matrix report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginmatrix-matrix-report
          path: .pluginmatrix/matrix-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginmatrix-runtime-artifacts
          path: |
            .pluginmatrix/runs/**/result.json
            .pluginmatrix/runs/**/server.log
            .pluginmatrix/runs/**/server/plugins/pluginmatrix-runtime-probe.json
            .pluginmatrix/runs/**/server/plugins/pluginmatrix-behavior-response.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write Job Summary
        if: always()
        env:
          MATRIX_REPORT: .pluginmatrix/matrix-report.json
        run: |
          python -m pluginmatrix.github_summary "$MATRIX_REPORT" "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Preserve Matrix exit code
        if: always()
        env:
          PREPARE_EXIT: ${{ steps.prepare.outputs.exit_code || '3' }}
          MATRIX_EXIT: ${{ steps.matrix.outputs.exit_code || '3' }}
        run: |
          case "$PREPARE_EXIT" in
            0) ;;
            1|2|3) exit "$PREPARE_EXIT" ;;
            *) exit 3 ;;
          esac
          case "$MATRIX_EXIT" in
            0|1|2|3) exit "$MATRIX_EXIT" ;;
            *) exit 3 ;;
          esac
